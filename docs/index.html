<!doctype html>

<html>
    <head>
        <meta charset="UTF-8" />
        <link rel="stylesheet" type="text/css" href="datatables.css" />
        <title>DataTables for Gren</title>
        <script type="text/javascript" src="app.js"></script>
        <style type="text/css">
            body {
                font-family: monospace;
            }

            #navigation > button {
                background: #ededed;
                border: 1px solid #ccc;
                padding: 5px 3px;
                border-radius: 3px;
                margin: 3px 0;
                cursor: pointer;
                width: 100%;
            }

            nav#navigation > button.active {
                background: #e5e5e5;
                -webkit-box-shadow: inset 0px 0px 5px #c1c1c1;
                -moz-box-shadow: inset 0px 0px 5px #c1c1c1;
                box-shadow: inset 0px 0px 5px #c1c1c1;
                //outline: none;
            }

            nav#navigation {
                position: absolute;
                min-width: 10em;
                width: 10%;
                height: 100vh;
            }

            article#example {
                margin-left: calc(7% + 10em);
                position: absolute;
            }
        </style>
    </head>

    <body>
        <div id="app"></div>
        <script type="text/javascript">
            Gren.DocBook.init({
                node: document.getElementById("app"),
            });
        </script>
    </body>
</html>
